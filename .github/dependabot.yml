version: 2
updates:
  # Python deps (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "deps"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      python-runtime:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "deps"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  # Astro Starlight site
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "deps"
      - "site"
    commit-message:
      prefix: "chore(site)"
      include: "scope"
    groups:
      site-runtime:
        patterns:
          - "*"
