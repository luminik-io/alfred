name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Determine tag
        id: tag
        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$RELEASE_INPUT_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Verify reviewed and signed release source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          tag_commit="$(bin/release-source-gate.sh "$tag" origin/main)"
          tag_object="$(git rev-parse "refs/tags/${tag}")"
          tag_verified="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '.verification.verified'
          )"
          commit_verified="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${tag_commit}" \
              --jq '.commit.verification.verified'
          )"
          if [ "$tag_verified" != "true" ]; then
            echo "::error::Release tag $tag is not verified"
            exit 1
          fi
          if [ "$commit_verified" != "true" ]; then
            echo "::error::Release commit $tag_commit is not verified"
            exit 1
          fi

      - name: Verify VERSION matches tag
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          version_in_file="$(git show "${tag}:VERSION" | tr -d '[:space:]')"
          tag_no_v="${tag#v}"
          if [ "$tag_no_v" != "$version_in_file" ]; then
            echo "::error::Tag $tag does not match VERSION file ($version_in_file)"
            exit 1
          fi

      - name: Extract changelog notes for this version
        id: notes
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          tag_no_v="${tag#v}"
          repo="${{ github.repository }}"
          git show "${tag}:CHANGELOG.md" > /tmp/tag-changelog.md
          bin/release-notes.sh "$tag_no_v" /tmp/tag-changelog.md \
            > /tmp/release-notes.md
          {
            echo
            echo "Full changelog: [CHANGELOG.md](https://github.com/${repo}/blob/${tag}/CHANGELOG.md)"
          } >> /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update DRAFT GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # Create the release as a DRAFT. The release body contains the
          # matching changelog Highlights.
          # The signed macOS assets and unsigned Linux assets are attached later
          # from the trusted packaging environment. Keep the release as a draft
          # until a human has checked the notes and attached the required assets.
          # Do not add --latest here: --latest publishes and defeats the draft gate.
          #
          # A rerun can update an existing draft. It never edits a published
          # release, including a legacy release that predates immutability.
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            release_state="$(
              gh release view "$tag" \
                --repo "${{ github.repository }}" \
                --json isDraft,isImmutable \
                --jq '[.isDraft, .isImmutable] | @tsv'
            )"
            IFS=$'\t' read -r is_draft is_immutable <<< "$release_state"
            if [ "$is_draft" = "true" ]; then
              gh release edit "$tag" \
                --repo "${{ github.repository }}" \
                --title "$tag" \
                --notes-file "${{ steps.notes.outputs.notes_file }}"
            else
              echo "::notice::Release $tag is already published; no update made (immutable=$is_immutable)"
            fi
          else
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes-file "${{ steps.notes.outputs.notes_file }}" \
              --draft \
              --verify-tag
          fi

      - name: Compute source tarball checksum (for brew formula)
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          tarball_url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"
          echo "::notice::Source tarball: $tarball_url"
          curl -fsSL "$tarball_url" -o /tmp/src.tar.gz
          sha256=$(shasum -a 256 /tmp/src.tar.gz | awk '{print $1}')
          echo "::notice::sha256: $sha256"
          echo "Update Formula/alfred-os.rb with this sha256 then push to your tap."
