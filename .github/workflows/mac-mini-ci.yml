name: Mac Mini CI

on:
  workflow_call:

concurrency:
  group: mac-mini-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    name: Required
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'mac-mini-ci' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: mac-mini-disposable
      labels: "alfred-job-${{ github.event.pull_request.head.sha }}"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"
          # The caller is a pull_request event, so GitHub scopes any workflow
          # cache token to that PR. Keep setup-uv's own cache disabled too.
          enable-cache: false

      - name: Static checks
        run: |
          set -Eeuo pipefail
          uv run --with 'ruff==0.15.22' ruff check .
          uv run --with 'ruff==0.15.22' ruff format --check .
          uv run --with 'mypy==2.3.0' mypy lib/
          bash bin/alfred-ci-shellcheck.sh
          bash bin/scrub-check.sh

      - name: Runtime tests
        run: |
          set -Eeuo pipefail
          uv run \
            --python 3.13 \
            --with 'pytest==9.1.1' \
            --with 'fastapi==0.140.13' \
            --with 'httpx==0.28.1' \
            --with 'httpx2==2.9.1' \
            pytest tests/ -q
