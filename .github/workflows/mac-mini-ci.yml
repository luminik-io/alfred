name: Mac Mini CI

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact verified same-repository pull-request head
        required: true
        type: string
      runner_label:
        description: One-use label minted by the trusted host control plane
        required: true
        type: string
      pr_number:
        description: Pull request recorded for the job receipt
        required: true
        type: string

concurrency:
  group: mac-mini-ci-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    name: Required
    runs-on:
      group: mac-mini-disposable
      labels: "${{ inputs.runner_label }}"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.0"

      - name: Static checks
        run: |
          set -Eeuo pipefail
          uv run --with 'ruff==0.15.22' ruff check .
          uv run --with 'ruff==0.15.22' ruff format --check .
          uv run --with 'mypy==2.3.0' mypy lib/
          bash bin/alfred-ci-shellcheck.sh
          bash bin/scrub-check.sh

      - name: Runtime tests
        run: |
          set -Eeuo pipefail
          uv run \
            --python 3.13 \
            --with 'pytest==9.1.1' \
            --with 'fastapi==0.140.13' \
            --with 'httpx==0.28.1' \
            --with 'httpx2==2.9.1' \
            pytest tests/ -q
