name: CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.rb"
      - "**/*.ts"
      - "**/*.tsx"
      - ".github/actions/**"
      - ".github/workflows/**"
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze supported languages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"

      - uses: github/codeql-action/init@v4
        with:
          languages: actions,javascript-typescript,python,ruby

      - uses: github/codeql-action/analyze@v4
