name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Core quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.scopes.outputs.python }}
      desktop: ${{ steps.scopes.outputs.desktop }}
      desktop_native: ${{ steps.scopes.outputs.desktop_native }}
      site_proof: ${{ steps.scopes.outputs.site_proof }}
      source: ${{ steps.scopes.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve changed surfaces
        id: scopes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          python=false
          desktop=false
          desktop_native=false
          site_proof=false
          source=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python=true
            desktop=true
            desktop_native=true
            site_proof=true
            source=true
          elif [ "$EVENT_NAME" = "schedule" ]; then
            python=true
          else
            changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"

            if grep -Eq '(^|/).*\.(py|sh|bash)$|^bin/|^pyproject\.toml$|^uv\.lock$|^\.github/workflows/ci\.yml$' <<<"$changed_files"; then
              source=true
            fi
            if [ "$source" = "false" ]; then
              while IFS= read -r changed_path; do
                [ -f "$changed_path" ] || continue
                if head -1 "$changed_path" | grep -qE '^#!.*\b(bash|sh)\b'; then
                  source=true
                  break
                fi
              done <<<"$changed_files"
            fi
            # Pytest validates more than Python modules: prompts, fixtures,
            # installers, service templates, skills, schemas, and workflow
            # contracts are all direct test inputs.
            if grep -Eq '(^|/).+\.py$|^tests/|^prompts/|^skills/|^examples/|^launchd/|^systemd/|^schema/|^bin/|^(install|deploy|get)\.sh$|^site/scripts/|^site/src/content/docs/|^docs/|^[^/]+\.md$|^\.env\.example$|^\.github/workflows/|^\.github/dependabot\.yml$|^pyproject\.toml$|^uv\.lock$' <<<"$changed_files"; then
              python=true
            fi
            if grep -Eq '^clients/desktop/|^lib/server/|^bin/alfred$|^pyproject\.toml$|^\.github/workflows/ci\.yml$' <<<"$changed_files"; then
              desktop=true
            fi
            if grep -Eq '^clients/desktop/src-tauri/|^clients/desktop/package(-lock)?\.json$|^\.github/workflows/ci\.yml$' <<<"$changed_files"; then
              desktop_native=true
            fi
            if grep -Eq '^site/scripts/|^site/package(-lock)?\.json$|^lib/self_proof\.py$|^\.github/workflows/ci\.yml$' <<<"$changed_files"; then
              site_proof=true
            fi
          fi

          {
            echo "python=$python"
            echo "desktop=$desktop"
            echo "desktop_native=$desktop_native"
            echo "site_proof=$site_proof"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v7
        if: steps.scopes.outputs.source == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Lint and type-check Python
        if: steps.scopes.outputs.source == 'true'
        run: |
          uv run --with 'ruff==0.15.22' ruff check .
          uv run --with 'ruff==0.15.22' ruff format --check .
          uv run --with 'mypy==2.3.0' mypy lib/

      - name: Compile every Python file
        if: steps.scopes.outputs.source == 'true'
        run: |
          find . -name "*.py" \
            ! -path "./site/node_modules/*" \
            ! -path "./.git/*" \
            -print0 | xargs -0 -n1 python3 -m py_compile
          python3 -m py_compile bin/alfred

      - name: Shellcheck
        if: steps.scopes.outputs.source == 'true'
        run: |
          shellcheck --version
          {
            find . -type f \
              \( -name "*.sh" -o -name "*.bash" \) \
              ! -path "./site/node_modules/*" \
              ! -path "./.git/*" \
              -print0
            find . -type f -perm -u+x \
              ! -path "./site/node_modules/*" \
              ! -path "./.git/*" \
              -exec sh -c \
                'head -1 "$1" | grep -qE "^#!.*\\b(bash|sh)\\b" && printf "%s\\0" "$1"' \
                _ {} \;
          } \
            | sort -zu \
            | xargs -0 shellcheck -S warning

      - name: Refuse known-private patterns
        run: bash bin/scrub-check.sh

      - name: Install gitleaks
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          bash bin/install-gitleaks.sh "$RUNNER_TEMP"

      - name: Scan pull-request commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --log-opts="$BASE_SHA..$HEAD_SHA" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            .

      - name: Set up Node for proof tests
        if: steps.scopes.outputs.site_proof == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"

      - name: Test proof emitter attribution and share
        if: steps.scopes.outputs.site_proof == 'true'
        working-directory: site
        run: npm test

      - name: Collect PR commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "PR_COMMITS<<PR_COMMITS_EOF"
            git log --format=%B "$BASE_SHA..$HEAD_SHA"
            echo "PR_COMMITS_EOF"
          } >> "$GITHUB_ENV"

      - name: Refuse private or raw PR metadata
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 bin/public-metadata-check.py

  python:
    name: Python compatibility
    needs: quality
    if: needs.quality.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # PRs test the current 3.13 runtime. The weekly and manual runs cover the
      # complete supported range without multiplying every synchronize event.
      - name: Test supported Python versions
        env:
          FULL_COMPATIBILITY: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          versions=(3.13)
          if [ "$FULL_COMPATIBILITY" = "true" ]; then
            versions=(3.11 3.12 3.13)
          fi
          uv python install "${versions[@]}"
          for version in "${versions[@]}"; do
            echo "==> pytest on Python $version"
            uv run \
              --python "$version" \
              --with pytest \
              --with fastapi \
              --with httpx \
              --with httpx2 \
              pytest tests/ -v
          done

  desktop:
    name: Desktop client
    needs: quality
    if: needs.quality.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        if: needs.quality.outputs.desktop_native == 'true'
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        if: needs.quality.outputs.desktop_native == 'true'
        with:
          workspaces: clients/desktop/src-tauri

      - name: Install Tauri Linux dependencies
        if: needs.quality.outputs.desktop_native == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: clients/desktop
        run: npm ci

      - name: Type-check and test frontend
        working-directory: clients/desktop
        run: |
          npm run typecheck
          npm run test

      - name: Install Playwright browser
        working-directory: clients/desktop
        run: npx playwright install --with-deps chromium

      - name: Test built desktop protocol
        working-directory: clients/desktop
        run: npm run test:contract

      - name: Check and test native shell
        if: needs.quality.outputs.desktop_native == 'true'
        working-directory: clients/desktop
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native shell
        if: needs.quality.outputs.desktop_native == 'true'
        working-directory: clients/desktop
        run: npm run tauri -- build --no-bundle --ci

  required:
    name: Required
    needs: [quality, python, desktop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce all applicable checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          set -euo pipefail
          for result in "$QUALITY_RESULT" "$PYTHON_RESULT" "$DESKTOP_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::An applicable CI job finished with: $result"
                exit 1
                ;;
            esac
          done
