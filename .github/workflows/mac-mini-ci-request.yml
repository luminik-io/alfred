name: Mac Mini CI Request

on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

jobs:
  request:
    if: >-
      github.event.label.name == 'mac-mini-ci' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: luminik-io/alfred/.github/workflows/mac-mini-ci.yml@main
