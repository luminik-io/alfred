name: gitleaks

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

concurrency:
  group: gitleaks-full-history
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The organization edition of the Gitleaks Action is paid. Install the
      # free MIT binary and verify its release checksum before executing it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          bash bin/install-gitleaks.sh "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan full history
        run: |
          gitleaks git \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            .
