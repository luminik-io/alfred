<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/alfred-logo-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alfred</title>
    <script id="alfred-theme-bootstrap" src="/theme-bootstrap.js"></script>
    <style>
      :root {
        --boot-background: #f7f6f2;
        --boot-card: rgba(255, 255, 255, 0.68);
        --boot-border: rgba(52, 61, 68, 0.12);
        --boot-shadow: rgba(39, 48, 56, 0.12);
        --boot-text: #273038;
        --boot-muted: #68727a;
        --boot-accent: #4f827c;
        color-scheme: light;
        background: var(--boot-background);
      }

      :root.dark {
        color-scheme: dark;
        --boot-background: #20242a;
        --boot-card: rgba(43, 49, 57, 0.88);
        --boot-border: rgba(231, 238, 242, 0.13);
        --boot-shadow: rgba(0, 0, 0, 0.32);
        --boot-text: #edf1f3;
        --boot-muted: #b7c0c6;
        --boot-accent: #84bbb4;
      }

      :root[data-theme="category-standard"].dark {
        --boot-background: #24272c;
        --boot-card: rgba(50, 54, 61, 0.94);
        --boot-accent: #8da9e6;
      }

      :root[data-theme="linked-fold"].dark {
        --boot-background: #282522;
        --boot-card: rgba(57, 52, 47, 0.94);
        --boot-accent: #d7ad58;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--boot-background);
      }

      .boot {
        display: grid;
        min-height: 100vh;
        place-items: center;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: var(--boot-text);
      }

      .boot__card {
        display: grid;
        justify-items: center;
        gap: 14px;
        padding: 26px 30px;
        background: var(--boot-card);
        border: 1px solid var(--boot-border);
        border-radius: 12px;
        box-shadow: 0 24px 70px var(--boot-shadow);
        -webkit-backdrop-filter: blur(24px) saturate(1.25);
        backdrop-filter: blur(24px) saturate(1.25);
      }

      .boot__mark {
        width: 42px;
        height: 42px;
        filter: drop-shadow(0 10px 18px rgba(77, 128, 122, 0.18));
      }

      .boot__title {
        margin: 0;
        font-size: 1.12rem;
        font-weight: 750;
      }

      .boot__caption {
        margin: 0;
        color: var(--boot-muted);
        font-size: 0.84rem;
      }

      .boot__dots {
        display: inline-flex;
        gap: 5px;
      }

      .boot__dots span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--boot-accent);
        animation: boot-dot 1.2s ease-in-out infinite;
      }

      .boot__dots span:nth-child(2) {
        animation-delay: 0.16s;
      }

      .boot__dots span:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes boot-dot {
        0%,
        70%,
        100% {
          opacity: 0.28;
          transform: translateY(0);
        }
        35% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
    </style>
  </head>

  <body>
    <!--
      THESIS: Alfred is a calm operating surface for supervised engineering work.
      OWN-WORLD: Prism, Graphite, and Ledger use purposeful material, exact state color, and dense evidence. Seed 4248c8f8.
      STORY: request, approval, execution, and proof remain visible as one controlled lifecycle.
      FIRST VIEWPORT: navigation, assignment, four work lanes, and the selected evidence inspector establish operator control immediately.
      FORM: native translucent chrome frames solid work surfaces; geometry and state edges change by theme without changing the information architecture.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot__card">
          <img class="boot__mark" src="/brand/alfred-logo-transparent.png" alt="" />
          <p class="boot__title">Starting Alfred</p>
          <p class="boot__caption">Connecting the local client.</p>
          <span class="boot__dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
